# =============================================================================
# CI cho chính repo fleet — kiểm chứng cấu hình TRƯỚC khi nó chạm môi trường thật.
# Cấu hình của một agent fleet là mã nguồn: nó phải có test như mã nguồn.
# =============================================================================
name: Fleet CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Kiểm chứng cấu hình
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - name: Cài yq
        run: |
          sudo curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Kiểm chứng toàn bộ cấu hình
        run: ./scripts/validate.sh

  policy:
    name: Test chính sách OPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cài OPA
        run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
      - run: opa test policy/opa/ -v

  orchestrator:
    name: Test bộ điều phối
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - working-directory: orchestration/langgraph
        run: |
          pip install -e ".[dev]"
          ruff check src tests
          pytest tests/ -q

  images:
    name: Dựng ảnh container
    runs-on: ubuntu-latest
    needs: [validate, policy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Dựng agent-runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.agent-runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Quét lỗ hổng ảnh
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: agent-runner:ci
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  secrets:
    name: Quét secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
