# Secret KHÔNG nằm trong git. Dùng External Secrets Operator kéo từ Vault/ASM/GSM.
# Nếu chưa có ESO, dùng Sealed Secrets — nhưng đừng bao giờ commit Secret thô.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata: { name: fleet-vault, namespace: fleet }
spec:
  provider:
    vault:
      server: https://vault.congty.vn
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: fleet
          # ServiceAccount RIÊNG cho việc đọc secret. Trước đây trường này trỏ
          # tới SA `agent-runner` — tức là danh tính dùng để đọc TOÀN BỘ secret
          # của fleet từ Vault lại chính là danh tính của container chạy code do
          # agent sinh ra. Ai lấy được token của SA đó thì đọc được cả kho.
          # Tách ra là việc gần như miễn phí; xem 10-rbac.yaml.
          serviceAccountRef: { name: external-secrets }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: fleet-model-keys, namespace: fleet }
spec:
  refreshInterval: 1h            # khoá xoay vòng tự động, không cần deploy lại
  secretStoreRef: { name: fleet-vault, kind: SecretStore }
  target: { name: fleet-model-keys, creationPolicy: Owner }
  data:
    - { secretKey: ANTHROPIC_API_KEY, remoteRef: { key: fleet/models, property: anthropic } }
    - { secretKey: OPENAI_API_KEY,    remoteRef: { key: fleet/models, property: openai } }
    - { secretKey: GEMINI_API_KEY,    remoteRef: { key: fleet/models, property: gemini } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: fleet-service-tokens, namespace: fleet }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: fleet-vault, kind: SecretStore }
  target: { name: fleet-service-tokens, creationPolicy: Owner }
  data:
    - { secretKey: OPENCLAW_GATEWAY_TOKEN, remoteRef: { key: fleet/gateway, property: token } }
    - { secretKey: MCPORTER_BRIDGE_TOKEN,  remoteRef: { key: fleet/mcporter, property: token } }
    - { secretKey: GITHUB_TOKEN,           remoteRef: { key: fleet/github, property: token } }
    - { secretKey: N8N_ENCRYPTION_KEY,     remoteRef: { key: fleet/n8n, property: encryptionKey } }
    - { secretKey: LANGGRAPH_TOKEN,        remoteRef: { key: fleet/langgraph, property: token } }
    - { secretKey: AGENT_RUNNER_TOKEN,     remoteRef: { key: fleet/agent-runner, property: token } }
---
# DSN checkpoint của LangGraph. Đã được `70-langgraph.yaml` tham chiếu từ đầu
# nhưng chưa từng được định nghĩa — cùng loại lỗi với fleet-mcp-credentials.
# PostgreSQL là dịch vụ quản lý NGOÀI cụm; nhớ thu hẹp CIDR 5432 trong
# `20-networkpolicy.yaml` cho khớp dải thật của nó.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: fleet-db, namespace: fleet }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: fleet-vault, kind: SecretStore }
  target: { name: fleet-db, creationPolicy: Owner }
  data:
    - { secretKey: checkpointDsn, remoteRef: { key: fleet/db, property: checkpointDsn } }
---
# Credential của các MCP server. CHỈ pod mcporter nhận secret này — đó là toàn
# bộ lý do tồn tại của tầng năng lực: agent chạm được hệ thống ngoài mà không
# bao giờ cầm credential của hệ thống đó.
#
# Secret này ĐÃ được `60-mcporter.yaml` tham chiếu từ đầu nhưng CHƯA từng được
# định nghĩa ở đâu — pod sẽ kẹt ở CreateContainerConfigError ngay lần apply đầu.
# Thuộc loại lỗi chỉ lộ ra trên cụm thật; `validate.sh` bước 8d giờ bắt được.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: fleet-mcp-credentials, namespace: fleet }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: fleet-vault, kind: SecretStore }
  target: { name: fleet-mcp-credentials, creationPolicy: Owner }
  data:
    - { secretKey: GITHUB_MCP_TOKEN,       remoteRef: { key: fleet/mcp, property: githubToken } }
    - { secretKey: GRAFANA_MCP_URL,        remoteRef: { key: fleet/mcp, property: grafanaUrl } }
    - { secretKey: GRAFANA_SA_TOKEN,       remoteRef: { key: fleet/mcp, property: grafanaToken } }
    - { secretKey: DW_READONLY_DSN,        remoteRef: { key: fleet/mcp, property: warehouseDsn } }
    - { secretKey: HUBSPOT_CLIENT_ID,      remoteRef: { key: fleet/mcp, property: hubspotClientId } }
    - { secretKey: HUBSPOT_CLIENT_SECRET,  remoteRef: { key: fleet/mcp, property: hubspotClientSecret } }
    - { secretKey: SERVICE_CATALOG_URL,    remoteRef: { key: fleet/mcp, property: serviceCatalogUrl } }
