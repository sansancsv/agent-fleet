# =============================================================================
# AGENT FLEET — ngăn xếp đầy đủ cho môi trường staging / máy phát triển
# -----------------------------------------------------------------------------
# 8 dịch vụ (+ openclaw-init chạy một lần), 4 tầng:
#   Tầng điều khiển  : openclaw-gateway     (cổng vào, định tuyến agent)
#   Tầng năng lực    : mcporter             (một cầu nối MCP duy nhất)
#   Tầng thực thi    : agent-runner         (API HTTP :8787 → acpx + các backend agent)
#   Tầng điều phối   : langgraph, n8n(+worker)
#   Hạ tầng          : postgres, redis
#
# Khởi động:  make up      (đọc .env ở thư mục gốc repo)
# Kiểm tra:   make health
# =============================================================================

name: agent-fleet

x-common-env: &common-env
  TZ: Asia/Ho_Chi_Minh
  FLEET_ENV: ${FLEET_ENV:-staging}
  FLEET_LOG_DIR: /var/log/fleet

x-logging: &logging
  driver: json-file
  options: { max-size: "50m", max-file: "5" }

services:

  # ---------------------------------------------------------------------------
  # HẠ TẦNG
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-fleet}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD bắt buộc}
      POSTGRES_DB: fleet
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-fleet} -d fleet"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  # ---------------------------------------------------------------------------
  # TẦNG NĂNG LỰC — mcporter: MỘT nguồn sự thật cho toàn bộ MCP server
  # ---------------------------------------------------------------------------
  mcporter:
    build:
      context: ../..
      # Ảnh RIÊNG, không dùng chung với agent-runner: pod này giữ toàn bộ
      # credential MCP nên không được chứa sẵn acpx/gh/git/run-role.sh.
      dockerfile: deploy/docker/Dockerfile.mcporter
    restart: unless-stopped
    # Gọi qua bash thay vì chạy trực tiếp: bit thực thi (+x) hay bị mất khi
    # repo nằm trên ổ Windows (/mnt/c) trong WSL.
    command: ["bash", "/fleet/capability-plane/bridge-up.sh"]
    environment:
      <<: *common-env
      MCPORTER_BRIDGE_PORT: "7420"
      MCPORTER_BRIDGE_BIND: "0.0.0.0"
      # Chỉ có tác dụng nếu bản mcporter đang cài hỗ trợ cờ xác thực; bridge-up.sh
      # dò lúc chạy và ghi rõ ra log khi không bật được. Để trống cũng chạy được,
      # nhưng lúc đó cách ly tầng mạng là lớp bảo vệ duy nhất.
      MCPORTER_BRIDGE_TOKEN: ${MCPORTER_BRIDGE_TOKEN:-}
      GITHUB_MCP_TOKEN: ${GITHUB_MCP_TOKEN:-}
      GRAFANA_MCP_URL: ${GRAFANA_MCP_URL:-}
      GRAFANA_SA_TOKEN: ${GRAFANA_SA_TOKEN:-}
      DW_READONLY_DSN: ${DW_READONLY_DSN:-}
      HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
    volumes:
      - ../../capability-plane/mcporter.json:/home/node/.mcporter/mcporter.json:ro
      - ../../capability-plane:/fleet/capability-plane:ro
      - mcporter-cred:/home/node/.local/share/mcporter
      - fleet-logs:/var/log/fleet
    healthcheck:
      # mcporter serve không có endpoint /healthz — kiểm tra bằng cổng TCP.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7420 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *logging

  # ---------------------------------------------------------------------------
  # TẦNG ĐIỀU KHIỂN — OpenClaw Gateway
  # ---------------------------------------------------------------------------

  # Bước dọn quyền, chạy một lần rồi thoát.
  #
  # VÌ SAO CẦN: khi một named volume được gắn vào thư mục CON chưa tồn tại trong
  # image, Docker tạo nó với chủ sở hữu root:root. Gateway chạy bằng user `node`
  # (uid 1000) nên không chmod được, và chết ngay lúc khởi động:
  #     EPERM: operation not permitted, chmod '/home/node/.openclaw/state'
  # Đây là cái bẫy kinh điển của "volume gắn vào thư mục con". Với image của
  # người khác, cách chắc chắn nhất là một init container chạy bằng root để
  # chuyển chủ sở hữu trước.
  openclaw-init:
    image: ghcr.io/openclaw/openclaw:${OPENCLAW_TAG:-2026.8.1}
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /home/node/.openclaw/state /home/node/.openclaw/audit
        chown -R node:node /home/node/.openclaw/state /home/node/.openclaw/audit
        chmod 700 /home/node/.openclaw/state
        echo "[init] quyền của state và audit đã sẵn sàng"
    volumes:
      - openclaw-state:/home/node/.openclaw/state
      - openclaw-audit:/home/node/.openclaw/audit
    restart: "no"
    logging: *logging

  openclaw-gateway:
    # GHIM PHIÊN BẢN. Schema cấu hình của OpenClaw đổi giữa các bản; dùng
    # ":latest" nghĩa là một hôm nào đó `docker compose pull` sẽ làm gateway
    # từ chối cấu hình đang chạy tốt. Nâng bản có chủ đích: đổi OPENCLAW_TAG
    # trong .env → `make oc-validate` → `make up`.
    image: ghcr.io/openclaw/openclaw:${OPENCLAW_TAG:-2026.8.1}
    restart: unless-stopped
    depends_on:
      mcporter: { condition: service_healthy }
      openclaw-init: { condition: service_completed_successfully }
    environment:
      <<: *common-env
      # LƯU Ý: gateway.bind KHÔNG đọc từ biến môi trường — OpenClaw đọc cấu hình
      # nguyên văn. Giá trị "lan" nằm thẳng trong control-plane/openclaw.json.
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?bắt buộc}
      OPENCLAW_SANDBOX: "1"
      MCPORTER_BRIDGE_URL: http://mcporter:7420/mcp
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      SLACK_BOT_TOKEN_ENGINEERING: ${SLACK_BOT_TOKEN_ENGINEERING:-}
      SLACK_APP_TOKEN_ENGINEERING: ${SLACK_APP_TOKEN_ENGINEERING:-}
      HOOK_SECRET_N8N: ${HOOK_SECRET_N8N:?bắt buộc}
      HOOK_SECRET_GITHUB: ${HOOK_SECRET_GITHUB:-}
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    volumes:
      - ../../control-plane/openclaw.json:/home/node/.openclaw/openclaw.json:ro
      - ../../control-plane/config.d:/home/node/.openclaw/config.d:ro
      - ../../control-plane/workspaces:/home/node/.openclaw/workspaces
      - ../../distribution-plane/skills:/home/node/.openclaw/skills:ro
      # State (phiên, ghép đôi kênh, sổ đăng ký plugin + chấp thuận quyền) nằm ở
      # /home/node/.openclaw/state/openclaw.sqlite — KHÔNG phải ~/.config/openclaw.
      # Gắn sai chỗ nghĩa là mỗi lần tạo lại container là mất sạch: phải ghép đôi
      # kênh lại, chấp thuận quyền plugin lại, và lịch sử phiên biến mất.
      - openclaw-state:/home/node/.openclaw/state
      # Volume audit RIÊNG, không dùng chung fleet-logs: hai image khác nhau
      # cùng khởi tạo một volume thì chủ sở hữu phụ thuộc container nào chạy
      # trước — một nguồn lỗi ngẫu nhiên rất khó lần.
      - openclaw-audit:/home/node/.openclaw/audit
      # Docker socket CHỈ cần khi bật sandbox per-tool. Cân nhắc kỹ: đây là
      # quyền tương đương root trên host. Ở K8s hãy dùng runtime sandbox thay thế.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18789/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    logging: *logging

  # ---------------------------------------------------------------------------
  # TẦNG THỰC THI — acpx + các backend agent (nhân bản được)
  # ---------------------------------------------------------------------------
  # Là một DỊCH VỤ HTTP (execution-plane/runner/server.mjs), không phải container
  # ngủ chờ `docker exec`. n8n và LangGraph gọi POST /run; dữ liệu ngoài đi vào
  # argv qua spawn() — không có shell nào diễn giải nó. Cổng 8787 KHÔNG map ra
  # host: chỉ các container trong mạng compose gọi tới, kèm Bearer token.
  agent-runner:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent-runner
    restart: unless-stopped
    command: ["node", "/fleet/execution-plane/runner/server.mjs"]
    depends_on:
      mcporter: { condition: service_healthy }
    environment:
      <<: *common-env
      RUNNER_PORT: "8787"
      RUNNER_TOKEN: ${AGENT_RUNNER_TOKEN:?bắt buộc — sinh bằng openssl rand -hex 32}
      RUNNER_MAX_CONCURRENT: "4"
      MCPORTER_BRIDGE_URL: http://mcporter:7420/mcp
      ACPX_AUTH_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ACPX_AUTH_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ACPX_AUTH_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # codex-acp 2.x tự đăng nhập bằng OPENAI_API_KEY (acpx đẩy ra từ
      # ACPX_AUTH_OPENAI_API_KEY) khi phiên cần; thiếu biến này mọi lượt codex
      # chết ở session/new. Không phải bí mật — xem //authPolicy trong acpx.global.json.
      DEFAULT_AUTH_REQUEST: '{"methodId":"api-key"}'
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      FLEET_REPO_ROOT: /srv/repos
    volumes:
      - ../../execution-plane/config/acpx.global.json:/home/node/.acpx/config.json:ro
      - ../../execution-plane:/fleet/execution-plane:ro
      - ../../capability-plane:/fleet/capability-plane:ro
      - ../../profiles:/fleet/profiles:ro
      - repos:/srv/repos
      - acpx-state:/home/node/.acpx
      - fleet-logs:/var/log/fleet
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      replicas: ${AGENT_RUNNER_REPLICAS:-2}
      resources:
        limits: { cpus: "4", memory: 8G }
    logging: *logging

  # ---------------------------------------------------------------------------
  # TẦNG ĐIỀU PHỐI — LangGraph (quy trình dài, bền vững, có người duyệt)
  # ---------------------------------------------------------------------------
  langgraph:
    build:
      context: ../../orchestration/langgraph
      dockerfile: ../../deploy/docker/Dockerfile.langgraph
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      agent-runner: { condition: service_healthy }
    environment:
      <<: *common-env
      # API từ chối mọi yêu cầu nếu thiếu token (fail closed) — xem server.py.
      LANGGRAPH_TOKEN: ${LANGGRAPH_TOKEN:?bắt buộc — sinh bằng openssl rand -hex 32}
      FLEET_CHECKPOINT_DSN: postgresql://${PG_USER:-fleet}:${PG_PASSWORD}@postgres:5432/fleet_checkpoints
      FLEET_REPO_ROOT: /srv/repos
      FLEET_PROFILES_DIR: /fleet/profiles
      # Có AGENT_RUNNER_URL → mọi lượt agent đi qua dịch vụ agent-runner thay vì
      # chạy acpx ngay trong container này. Một chỗ chạy, một chỗ ghi log.
      AGENT_RUNNER_URL: http://agent-runner:8787
      AGENT_RUNNER_TOKEN: ${AGENT_RUNNER_TOKEN}
      MCPORTER_BRIDGE_URL: http://mcporter:7420/mcp
      ACPX_AUTH_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ACPX_AUTH_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ACPX_AUTH_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Bộ nhớ giữa các phiên và vết chạy. Cả hai CHỈ do container này ghi —
      # agent-runner không mount, nên không có màn tranh chấp quyền giữa hai
      # image như đã gặp với openclaw-audit (xem docs/05 §quyền volume).
      FLEET_MEMORY_DIR: /srv/fleet-memory
      FLEET_TRAJECTORY_DIR: /var/log/fleet/trajectory
    ports:
      - "127.0.0.1:${LANGGRAPH_PORT:-2024}:8000"
    volumes:
      - repos:/srv/repos
      - ../../profiles:/fleet/profiles:ro
      - ../../execution-plane/config/acpx.global.json:/root/.acpx/config.json:ro
      - fleet-logs:/var/log/fleet
      # Volume RIÊNG cho bộ nhớ: mất fleet-logs là mất số liệu, chấp nhận được;
      # mất bộ nhớ là fleet quên sạch mọi bài học đã tích luỹ.
      - fleet-memory:/srv/fleet-memory
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ok',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging

  # ---------------------------------------------------------------------------
  # TẦNG ĐIỀU PHỐI — n8n ở queue mode (bắt buộc cho môi trường thật)
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:${N8N_TAG:-2.36.9}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: &n8n-env
      <<: *common-env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${PG_USER:-fleet}
      DB_POSTGRESDB_PASSWORD: ${PG_PASSWORD}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      N8N_RUNNERS_ENABLED: "true"
      # KHÔNG BAO GIỜ đổi khoá này sau khi đã lưu credential — đổi là mất hết.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?bắt buộc, tối thiểu 32 ký tự}
      EXECUTIONS_TIMEOUT: "3600"
      EXECUTIONS_TIMEOUT_MAX: "7200"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      N8N_DIAGNOSTICS_ENABLED: "false"
      # n8n bản mới mặc định chặn $env.* trong expression node (bảo mật) — các
      # workflow của fleet đọc LANGGRAPH_URL/TOKEN qua $env nên cần mở lại.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      OPENCLAW_GATEWAY_URL: http://openclaw-gateway:18789
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      LANGGRAPH_URL: http://langgraph:8000
      LANGGRAPH_TOKEN: ${LANGGRAPH_TOKEN}
      # Workflow gọi agent qua HTTP (POST /run) — KHÔNG dùng node executeCommand.
      # validate.sh cấm executeCommand trong orchestration/n8n/workflows/.
      AGENT_RUNNER_URL: http://agent-runner:8787
      AGENT_RUNNER_TOKEN: ${AGENT_RUNNER_TOKEN}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ../../orchestration/n8n/workflows:/workflows:ro
    healthcheck:
      # n8n mất 20–40 giây để chạy migration lần đầu. Không có healthcheck thì
      # `make health` chạy quá sớm và báo lỗi giả.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging: *logging

  n8n-worker:
    image: n8nio/n8n:${N8N_TAG:-2.36.9}
    restart: unless-stopped
    command: ["worker", "--concurrency=5"]
    depends_on:
      n8n: { condition: service_started }
    environment: *n8n-env
    # Cố ý KHÔNG mount execution-plane hay kho repo: worker không chạy agent,
    # nó gọi agent-runner qua HTTP. Image n8n cũng không có acpx/python3.
    volumes:
      - n8ndata:/home/node/.n8n
    deploy:
      replicas: ${N8N_WORKER_REPLICAS:-2}
    logging: *logging

  # ---------------------------------------------------------------------------
  # INGRESS CÔNG KHAI (TUỲ CHỌN) — Cloudflare Named Tunnel
  # ---------------------------------------------------------------------------
  # KHÔNG chạy cùng `make up`: đứng sau profile "tunnel" nên mặc định đứng im,
  # bật bằng `make tunnel-up`. Đây là bản thay thế cho Cloudflare Quick Tunnel
  # (`cloudflared tunnel --url ...`) đã ghi nhận là KHÔNG ổn định ở
  # docs/05-runbook.md §"Webhook GitHub... Quick Tunnel" — Quick Tunnel không
  # có tài khoản, sinh URL ngẫu nhiên, và có thể chết bất cứ lúc nào kèm
  # "Unauthorized: Tunnel not found" dù tiến trình vẫn sống. Named Tunnel gắn
  # với một tài khoản Cloudflare cố định, dùng TOKEN xác thực nên không có vấn
  # đề đó.
  #
  # Cơ chế: token của Named Tunnel (Cloudflare Zero Trust → Networks → Tunnels
  # → chọn tunnel → Install connector → Docker) chỉ xác thực container này với
  # Cloudflare; việc "domain X trỏ vào dịch vụ nào trong compose" được cấu hình
  # ở tab "Public Hostname" trên dashboard đó — KHÔNG có file YAML ingress cục
  # bộ nào trong repo phải sửa. Điền hostname công khai, trỏ Service tới
  # "http://<tên-dịch-vụ-compose>:<cổng-nội-bộ>" — ví dụ:
  #   n8n.miền-của-bạn.com          → http://n8n:5678
  #   fleet-hooks.miền-của-bạn.com  → http://openclaw-gateway:18789
  # cloudflared nằm chung mạng Docker mặc định của project này nên phân giải
  # được tên dịch vụ mà không cần map cổng ra host.
  #
  # CẢNH BÁO: đừng trỏ hostname công khai thẳng vào n8n nếu nó lộ luôn giao
  # diện quản trị — chỉ nên public đúng path webhook cần, hoặc đặt Cloudflare
  # Access trước hostname đó. openclaw-gateway tự có `hooks.token` bắt buộc
  # (control-plane/config.d/channels.json) nên path /hooks/* đã có một lớp
  # xác thực riêng, nhưng vẫn nên giới hạn ở tầng Cloudflare Access nếu có thể.
  cloudflared:
    # GHIM PHIÊN BẢN — image này không có shell/curl/wget bên trong (distroless),
    # nên healthcheck không viết được bằng CMD-SHELL; theo dõi bằng
    # `make tunnel-logs` (tìm dòng "Registered tunnel connection").
    image: cloudflare/cloudflared:2026.9.0
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TZ: Asia/Ho_Chi_Minh
      # Named Tunnel dùng TOKEN xác thực, KHÔNG dùng credentials.json cục bộ.
      # Lấy token ở bước "Install connector → Docker" trên dashboard tunnel đó.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?bắt buộc khi bật profile "tunnel" — lấy ở Cloudflare Zero Trust → Networks → Tunnels}
    logging: *logging

volumes:
  openclaw-audit:
  pgdata:
  redisdata:
  n8ndata:
  repos:
  openclaw-state:
  acpx-state:
  mcporter-cred:
  fleet-logs:
  fleet-memory:
