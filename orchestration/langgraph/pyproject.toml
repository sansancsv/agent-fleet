[project]
name = "fleet-orchestrator"
version = "1.0.0"
description = "Điều phối bền vững cho Agent Fleet — LangGraph + acpx"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.9",
  # Server của fleet. LƯU Ý: gói `langgraph` KHÔNG kèm lệnh `langgraph`
  # (CLI nằm ở `langgraph-cli`), và `langgraph up` dựng Docker Compose nên
  # không dùng được bên trong container. Ta tự phục vụ đồ thị bằng uvicorn.
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "langgraph-cli[inmem]>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Ghim tập luật tường minh. `ruff>=0.7` không có cận trên, và ruff 0.16 đã mở
# rộng tập luật mặc định (E4/E7/E9/F → hơn 400 luật): CI đỏ dù code không đổi.
# Muốn bật thêm luật thì thêm vào đây, có chủ đích.
# ASYNC: cấm lời gọi chặn (subprocess.run, I/O đĩa...) ngay trong hàm async —
# server.py chạy mọi run trên MỘT event loop, một lời gọi chặn treo cả server.
select = ["E4", "E7", "E9", "F", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
