name: Chăm sóc khách hàng
dataClass: confidential

requesters: ["*"]
approvers: ["support-lead@congty.vn"]

capabilityPack: support
dataSources:
  - "Notion: cơ sở tri thức, macro trả lời"
  - "Linear: lỗi đã biết và trạng thái xử lý"
  - "Kho dữ liệu: lịch sử ticket (đã ẩn danh)"

agents:
  # dataClass=confidential → chỉ claude và local-llm (policy/model-routing.yaml,
  # validate.sh bước 8a). Claude soạn, model tự host thẩm định — vẫn khác nhà
  # cung cấp (bước 8). Phân loại cũng chạy tự host: rẻ, và dữ liệu khách hàng
  # chỉ rời hạ tầng công ty ở đúng một bước (soạn thảo).
  #
  # ĐÁNH ĐỔI — local-llm CHƯA DỰNG: acpx.global.json trỏ backend này tới
  # /fleet/bin/local-acp-bridge.mjs, file chưa có trong repo. Cho tới khi có,
  # hồ sơ này KHÔNG chạy được: flow dept-request dừng ngay ở bước phân loại,
  # trước khi tiêu token Claude cho một bản nháp không ai thẩm định được. Đó là
  # chủ đích. Các lựa chọn còn lại đều tệ hơn: Gemini vi phạm dataClass;
  # claude+claude là tự chấm bài mình; hạ xuống internal là khai sai độ nhạy
  # cảm của dữ liệu khách hàng. Xem docs/03-mo-rong-phong-ban.md.
  classifier: local-llm
  drafter: claude
  reviewer: local-llm

categories: [loi-ky-thuat, thanh-toan, huong-dan-su-dung, yeu-cau-tinh-nang, khieu-nai]

reviewCriteria:
  - "Không hứa thời hạn sửa lỗi khi chưa có trong Linear"
  - "Không tiết lộ thông tin nội bộ hoặc thông tin khách hàng khác"
  - "Giọng điệu đồng cảm nhưng không nhận lỗi thay pháp chế"
  - "Có bước tiếp theo cụ thể cho khách hàng"

systemPrompt: |
  Trả lời ngắn, đi thẳng vào cách giải quyết. Nếu là lỗi đã biết, dẫn link trạng
  thái. Nếu chưa biết, nói thật là chưa biết và nêu bước điều tra tiếp theo cùng
  mốc thời gian phản hồi. Không bao giờ bịa số hiệu ticket.

output:
  server: linear
  tool: save_comment
  params: {}

limits:
  maxCostUsdPerRequest: 1
  maxRevisions: 1
